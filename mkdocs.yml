      - "02 · create-next-app & Project Structure": level-1/02-create-next-app-structure.md
      - "03 · File-Based Routing & Layouts": level-1/03-file-routing-layouts.md
      - "04 · Pages & Navigation with Link": level-1/04-pages-navigation-link.md
      - "05 · Server vs Client Components": level-1/05-server-vs-client-components.md
      - "06 · Styling Options": level-1/06-styling.md
      - "07 · Images, Fonts & Metadata": level-1/07-images-fonts-metadata.md
      - "08 · Static Assets & the public Folder": level-1/08-static-assets-public.md
      - "09 · Fetching Data in Server Components": level-1/09-data-fetching-basics.md
